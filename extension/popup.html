<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>小鲸 · 一起看</title><link rel="stylesheet" href="popup.css"></head><body><header><span>◉</span><div><h1>和小鲸一起看</h1><p>让浏览，多一点陪伴。</p></div></header><main><div id="pairing"><label for="token">本机配对码</label><input type="password" id="token" placeholder="从桌宠设置中复制" autocomplete="off"><button id="connect">连接桌宠</button></div><div class="main-actions"><button class="primary" id="share">分享当前页面</button><button id="selection">只分享选中的文字</button><button id="follow">跟随当前浏览标签</button><button id="stop" class="quiet">停止一起看</button><button id="pair-again" class="quiet">更换配对码</button></div><p id="status" role="status">先在桌宠里打开“一起看”。</p><details><summary>分享哪些内容？</summary><p>只向本机桌宠发送当前页面的标题、网址、可见正文和选中文字。后续由你选用的智能体处理。输入框、表单、可编辑区域及其中选中文字不读取，也不读取 Cookie。</p><p>“跟随”需要网页权限，只跟随当前活动标签页；切换站点或浏览器窗口也会更新。浏览器内部页和无痕窗口不读取。关闭一起看或断开连接后需要再次点击跟随，不会静默恢复。</p></details></main><script src="popup.js"></script></body></html>
