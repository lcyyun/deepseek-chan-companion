# Replace the plugin's absolute path with your checkout path.
# Set L2D_BRIDGE_TOKEN in the DSH process environment, or use tokenFile below.
# Never commit a real token or a generated patch containing one.
# Set DSH_HOME before starting DSH to isolate its profile and companion workspace.
- insert:
    - id: live2d-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: live2d
        transport: streamable-http
        url: http://127.0.0.1:39181/mcp
        headers:
          Authorization: !!js '`Bearer ${process.env.L2D_BRIDGE_TOKEN}`'
    - id: live2d-state-bridge
      name: 'C:/path/to/deepseek-chan-companion/integrations/dsh/live2d-bridge.mjs'
      config:
        baseUrl: http://127.0.0.1:39181
        chat: true
        # Native tool mode. The agent chats normally and calls avatar_reply once
        # per turn when performance is wanted; no long JSON prompt is injected.
        native: true
        # Preferred manual option: a local token file instead of an env variable.
        # The app-generated patch uses this automatically.
        # tokenFile: C:/Users/you/AppData/Roaming/大肥鱼 · DeepSeek-chan/bridge-token
        # Ask the user first: A = existing conversation, B = new dedicated pet.
        # A: put the selected existing session here.
        # B: omit chatSessionId and use sessionFile; the bridge writes the new ID.
        # chatSessionId: your-conversation-session-id
        # sessionFile: C:/path/to/companion/session.txt
        # Default: <DSH_HOME>/live2d-companion; without DSH_HOME: ~/.dsh/live2d-companion.
        # Optional explicit overrides (normally leave unset for profile isolation):
        # dshHome: C:/path/to/isolated-dsh-home
        # chatCwd: C:/path/to/explicit-companion-workspace
        # Exact names of trusted, installed read-only web tools. Empty means no web search.
        searchTools: []
        # Optional: restrict the shared pet to one DSH session.
        # sessionId: your-session-id
